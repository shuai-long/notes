<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>abap notes</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Description" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#42b983" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#272822" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/pwa-icon.svg" type="image/svg+xml" />
    <!-- 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- 添加tab标签 -->
    <link rel="stylesheet" href="./_css/dashboard.min.css" />

    <!-- 代码插件样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-solarizedlight.min.css"
        id="prism-theme-light" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css"
        id="prism-theme-dark" disabled />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/match-braces/prism-match-braces.min.css">

    <!-- 主题插件 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable/dist/css/theme-simple.css"
        id="docsify-theme-light" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable/dist/css/theme-simple-dark.css"
        id="docsify-theme-dark" disabled />
    <link rel="stylesheet" href="./_css/theme-custom.min.css" />
    <script>
        (function () {
            var mediaQuery = window.matchMedia
                ? window.matchMedia("(prefers-color-scheme: dark)")
                : null;

            function setLinkState(id, disabled) {
                var link = document.getElementById(id);
                if (link) link.disabled = disabled;
            }

            function applySystemTheme() {
                var isDark = mediaQuery ? mediaQuery.matches : false;
                var theme = isDark ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", theme);
                setLinkState("docsify-theme-light", isDark);
                setLinkState("docsify-theme-dark", !isDark);
                setLinkState("prism-theme-light", isDark);
                setLinkState("prism-theme-dark", !isDark);

                if (typeof CustomEvent === "function") {
                    document.dispatchEvent(new CustomEvent("theme-change", { detail: theme }));
                }
            }

            window.__docsifyApplySystemTheme = applySystemTheme;
            applySystemTheme();

            if (mediaQuery) {
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener("change", applySystemTheme);
                } else if (mediaQuery.addListener) {
                    mediaQuery.addListener(applySystemTheme);
                }
            }
        })();
    </script>
</head>

<body>
    <!-- 定义加载时候的动作 -->
    <div id="app">加载中...</div>
    <script>
        window.$docsify = {
            // 项目名称
            name: "notes",
            // 仓库地址，点击右上角的Github章鱼猫头像会跳转到此地址
            repo: " https://github.com/shuai-long/notes",
            // 最大支持渲染的标题层级
            maxLevel: 6,
            // 侧边栏支持，默认加载的是项目根目录下的_sidebar.md文件
            loadSidebar: true,
            // 自定义侧边栏后默认不会再生成目录，设置生成目录的最大层级（建议配置为2-4）
            subMaxLevel: 4,
            // 导航栏支持，默认加载的是项目根目录下的_navbar.md文件
            loadNavbar: true,
            // 封面支持，默认加载的是项目根目录下的_coverpage.md文件
            coverpage: true,
            // 小屏设备下合并导航栏到侧边栏
            mergeNavbar: true,
            // 自动为每个页面增加标题。
            autoHeader: false,
            // 只在访问主页时加载封面。
            onlyCover: false,
            // 换页自动回顶
            auto2top: true,
            // 警告框插件
            'flexible-alerts': {
                style: 'flat'
            },
            // 显示流程图插件
            mermaidConfig: {
                querySelector: ".mermaid",
            },
            // 流程图缩放
            mermaidZoom: {
                minimumScale: 1,
                maximumScale: 5,
                zoomPannel: true,
            },

            // 代码块折叠
            hideCode: {
                scroll: true, // Enable scrolling
                height: 500, // Max height
                minLines: 28, // 低于该行数不做高度测量，减少布局计算
            },

            // 分页插件
            pagination: {
                previousText: "Pre",
                nextText: "Next",
                crossChapter: true,
                crossChapterText: true,
            },

            // 主题样式
            themeable: {
                readyTransition: true, // default
                responsiveTables: true, // default
            },

            // 插件功能配置
            prism: {
                copySuccessText: "复制成功", // 自定义复制成功提示
                maxMatchBracesChars: 12000, // 长代码块跳过括号匹配二次高亮
                showLanguage: {
                    useDataAttribute: true, // 是否使用 data-language 属性显示语言标签
                    mapping: {
                        // 语言标签映射（可选）
                        js: "JavaScript",
                        py: "Python",
                        sh: "Shell",
                    },
                },
            },

            // 代码块工具配置
            codeButton: {
                lineNumbers: true,
                maxLineNumbers: 500, // 长代码块不生成逐行 DOM，避免页面卡顿
            },

            // 中英文自动空格
            spacing: {
                selector: ".markdown-section",
            },

            // 添加tab标签
            dashboard: {
                numTabContent: 3, //幻灯片中显示的卡片数量
                metadataUrl: "metadata/posts",
                sort: false, // sort the posts by time
                theme: "default", // (1) default, (2) cards, (3) list
                tagboardTheme: "default", // options are same as above
            },

            tabs: {
                persist: true, // default 确定页面刷新/重新访问后是否恢复选项卡选择
                sync: true, // default 确定选项卡选择是否将在具有匹配标签的选项卡之间同步。
                theme: "classic", // default 设置标签页主题。值为false表示不应用任何主题，该值应在创建自定义标签页主题时使用。
                tabComments: true, // default 确定是否可以使用选项卡注释来定义选项卡集中的选项卡。
                tabHeadings: true, // default 确定是否可以使用标题 + 粗体标记来定义选项卡集中的选项卡。
            },

            // 设置请求资源的请求头。
            requestHeaders: {
                "cache-control": "max-age=600",
            },

            // 设置全局搜索
            search: {
                maxAge: 86400000, // 过期时间，单位毫秒，默认一天
                paths: "auto", // 使用懒加载搜索插件，只有聚焦搜索框时才索引全站
                placeholder: "搜索",
                noData: "No Results",
                depth: 4,
                hideOtherSidebarContent: false,
                namespace: "Docsify-Guide",
            },
        };
    </script>

    <!-- Docsify 核心 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

    <!-- Docsify 主题 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-themeable/dist/js/docsify-themeable.min.js"></script>

    <!-- Prism 语言组件 -->
    <script>
        window.Prism = window.Prism || {};
        window.Prism.manual = true;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-abap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/match-braces/prism-match-braces.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/normalize-whitespace/prism-normalize-whitespace.min.js"></script>
    <script src="./plugins/docsify/lib/plugins/prismjs-class.js"></script>

    <!-- 侧边栏添加折叠 -->
    <script src="./plugins/docsify/lib/plugins/docsify-sidebar-collapse.min.js"></script>

    <!-- 标题添加折叠-->
    <script src="./plugins/docsify/lib/plugins/docsify-header-collapse.min.js"></script>

    <!-- 插入pdf插件 -->
    <script src="./plugins/docsify/lib/plugins/pdfobject.min.js"></script>
    <script src="./plugins/docsify/lib/plugins/docsify-pdf-embed.min.js"></script>

    <!-- 显示流程图插件+流程图缩放插件 -->
    <script src="./plugins/docsify/lib/plugins/d3.min.js"></script>
    <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
        mermaid.initialize({ startOnLoad: true });
        window.mermaid = mermaid;
    </script>
    <script src="./plugins/docsify/lib/plugins/docsify-mermaid.min.js"></script>
    <script src="./plugins/docsify/lib/plugins/docsify-mermaid-zoom.min.js"></script>

    <!-- 显示图像标题 -->
    <script src="./plugins/docsify/lib/plugins/docsify-image-caption.min.js"></script>

    <!-- 警告块 -->
    <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>

    <!-- 图片放大缩小支持 -->
    <script src="./plugins/docsify/lib/plugins/zoom-image.min.js"></script>

    <!-- 搜索功能支持 -->
    <script src="./plugins/docsify/lib/plugins/search-lazy.js"></script>

    <!-- 添加tab标签 -->
    <script src="./plugins/docsify/lib/plugins/docsify-tabs.min.js"></script>
    <script src="./plugins/docsify/lib/plugins/docsify-tabs-fix.js"></script>
    <script src="./plugins/docsify/lib/plugins/docsify-dashboard.js"></script>

    <!-- 代码块按钮 -->
    <script src="./plugins/docsify/lib/plugins/code-button.js"></script>

    <!-- 移动端表格滚动 -->
    <script src="./plugins/docsify/lib/plugins/docsify-responsive-tables.js"></script>

    <!-- 返回顶部 -->
    <script src="./plugins/docsify/lib/plugins/docsify-back-to-top.js"></script>

    <!-- 代码块折叠 -->
    <script src="./plugins/docsify/lib/plugins/docsify-hide-code.js"></script>

    <!-- 行内代码高亮 -->
    <script src="./plugins/docsify/lib/plugins/docsify-inline-code-highing.js"></script>

    <!-- 中英文自动空格 -->
    <script src="./plugins/docsify/lib/plugins/pangu.min.js"></script>
    <script src="./plugins/docsify/lib/plugins/docsify-spacing.js"></script>

    <!-- 分页插件
    <script src="./plugins/docsify/lib/plugins/docsify-pagination.min.js"></script> -->

    <script>
        //注册 离线模式
        if (typeof navigator.serviceWorker !== "undefined") {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function (error) {
                    console.warn("Service worker registration failed:", error);
                });
            });
        }
    </script>
</body>

</html>
