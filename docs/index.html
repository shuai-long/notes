<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Docsify-Guide</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Description">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="theme-color" content="#fff7eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f2329" media="(prefers-color-scheme: dark)">
    <meta name="application-name" content="notes">
    <meta name="apple-mobile-web-app-title" content="notes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon.svg">
    <!-- 设置浏览器图标 -->
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="./icons/icon.svg" type="image/svg+xml" />
    <!-- 默认主题，深色模式跟随系统切换 -->
    <link id="docsify-theme-light" rel="stylesheet" href="./vendor/docsify-themeable/theme-simple.css">
    <link id="docsify-theme-dark" rel="stylesheet" href="./vendor/docsify-themeable/theme-simple-dark.css"
        media="(prefers-color-scheme: dark)">
    <!-- 代码高亮主题 -->
    <link rel="stylesheet" href="./vendor/prism/themes/prism.min.css">
    <link rel="stylesheet" href="./_css/code-highlight.css?v=20260510-code-render">
    <link rel="stylesheet" href="./_css/code-block-tools.css?v=20260510-code-render">
    <link rel="stylesheet" href="./_css/inline-code-copy.css">
    <link rel="stylesheet" href="./_css/responsive-table.css">
    <link rel="stylesheet" href="./_css/file-embed.css">
    <link rel="stylesheet" href="./_css/media-player.css">
    <link rel="stylesheet" href="./_css/image-frame.css">
    <link rel="stylesheet" href="./_css/image-grid.css">
    <link rel="stylesheet" href="./_css/search-enhance.css">
    <link rel="stylesheet" href="./_css/callout.css">
    <link rel="stylesheet" href="./_css/sidebar-tree.css">
    <link rel="stylesheet" href="./_css/heading-number.css">
    <link rel="stylesheet" href="./_css/layout.css">
    <link rel="stylesheet" href="./_css/theme-toggle.css">
    <link rel="stylesheet" href="./_css/plugin-integrations.css">
    <link rel="stylesheet" href="./_css/warm-light-theme.css">
</head>

<body>
    <!-- 定义加载时候的动作 -->
    <div id="app">加载中...</div>
    <script>
        window.$docsify = {
            // 项目名称
            name: 'notes',
            // 仓库地址，点击右上角的Github章鱼猫头像会跳转到此地址
            repo: 'https://github.com/shuai-long/notes',
            // 侧边栏支持，默认加载的是项目根目录下的_sidebar.md文件
            loadSidebar: true,
            // 导航栏支持，默认加载的是项目根目录下的_navbar.md文件
            loadNavbar: true,
            // 封面支持，默认加载的是项目根目录下的_coverpage.md文件
            coverpage: true,
            // 最大支持渲染的标题层级
            maxLevel: 5,
            // 自定义侧边栏后默认不会再生成目录，设置生成目录的最大层级（建议配置为2-4）
            subMaxLevel: 4,
            // 小屏设备下合并导航栏到侧边栏
            mergeNavbar: true,
            // 顶部固定导航遮挡时，锚点跳转保留偏移
            topMargin: 56,
            // 代码高亮
            codeHighlight: {
                languagesPath: './vendor/prism/components/'
            },
            // 代码块行号和折叠
            codeBlockTools: {
                collapseHeight: 420,
                lineNumbers: true
            },
            // 行内代码点击复制
            inlineCodeCopy: {
                copyText: '点击复制',
                copiedText: '已复制',
                errorText: '复制失败'
            },
            // 侧边栏文件夹展开关闭
            sidebarTree: {
                collapseByDefault: true,
                expandActive: true
            },
            // 大屏侧边栏宽度调节
            sidebarResize: {
                minWidth: 260,
                maxWidth: 520,
                storageKey: 'docsify-sidebar-width'
            },
            // 正文标题自动编号
            headingNumber: {
                selector: 'h1,h2,h3,h4,h5,h6'
            },
            // 中英文之间自动增加空格
            cjkSpacing: {
                selector: '.markdown-section, .sidebar'
            },
            // 小屏幕表格纵向展示
            responsiveTables: {
                selector: '.markdown-section table'
            },
            // 图片等宽背景展示
            imageFrame: {
                selector: '.markdown-section'
            },
            // 图片排列
            imageGrid: {
                defaultColumns: 2,
                defaultGap: '12px',
                defaultMinWidth: '260px',
                maxColumns: 6
            },
            // PDF/HTML 文件嵌入预览
            fileEmbed: {
                openText: '打开'
            },
            // 音频/视频播放
            mediaPlayer: {
                openText: '打开',
                preload: 'metadata'
            },
            // Mermaid 图表
            mermaidConfig: {
                querySelector: '.mermaid'
            },
            // 阅读进度条
            progress: {
                position: 'top',
                color: 'var(--theme-color,#42b983)',
                height: '2px'
            },
            // 上一章/下一章
            pagination: {
                previousText: '上一章',
                nextText: '下一章',
                crossChapter: true,
                crossChapterText: true
            },
            // 主题切换
            themeToggle: {
                storageKey: 'docsify-theme-mode'
            },
            // 自动打开上次浏览内容
            lastVisit: {
                storageKey: 'docsify-last-visit',
                restoreAtRoot: true
            },
            /*搜索相关设置*/
            search: {
                maxAge: 86400000,// 过期时间，单位毫秒，默认一天
                paths: 'auto',// 注意：仅适用于 paths: 'auto' 模式
                placeholder: '搜索',              
                // 支持本地化
                placeholder: {
                    '/zh-cn/': '搜索',
                    '/': 'Type to search'
                },
                noData: '找不到结果',
                depth: 6,
                hideOtherSidebarContent: false,
                namespace: 'Docsify-Guide-v2',
            }
        }
    </script>
    <!-- 自动打开上次浏览内容 -->
    <script src="./plugins/last-visit.js"></script>
    <!-- docsify的js依赖 -->
    <script src="./vendor/docsify/docsify.min.js"></script>
    <!-- 代码高亮支持 -->
    <script src="./vendor/prism/components/prism-abap.min.js"></script>
    <script src="./vendor/prism/components/prism-bash.min.js"></script>
    <script src="./vendor/prism/components/prism-batch.min.js"></script>
    <script src="./vendor/prism/components/prism-markdown.min.js"></script>
    <script src="./vendor/prism/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="./plugins/code-highlight.js?v=20260510-code-render"></script>
    <!-- Mermaid 图表支持 -->
    <script src="./vendor/mermaid/mermaid.min.js"></script>
    <script>
        if (window.mermaid) {
            window.mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'loose',
                theme: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
            });
        }
    </script>
    <script src="./vendor/docsify-mermaid/docsify-mermaid.js"></script>
    <!-- emoji表情支持 -->
    <script src="./vendor/docsify/plugins/emoji.min.js"></script>
    <!-- 图片放大缩小支持 -->
    <script src="./vendor/docsify/plugins/zoom-image.min.js"></script>
    <!-- 搜索功能支持 -->
    <script src="./vendor/docsify/plugins/search.min.js"></script>
    <script src="./plugins/search-enhance.js"></script>
    <!-- 代码块行号和折叠 -->
    <script src="./plugins/code-block-tools.js?v=20260510-code-render"></script>
    <!-- 行内代码点击复制 -->
    <script src="./plugins/inline-code-copy.js"></script>
    <!-- 侧边栏文件夹展开关闭 -->
    <script src="./plugins/sidebar-tree.js"></script>
    <!-- 大屏侧边栏宽度调节 -->
    <script src="./plugins/sidebar-resize.js"></script>
    <!-- 正文标题自动编号 -->
    <script src="./plugins/heading-number.js"></script>
    <!-- Note/Warning 等提示块样式 -->
    <script src="./plugins/callout.js"></script>
    <!-- 中英文之间自动增加空格 -->
    <script src="./plugins/cjk-spacing.js"></script>
    <!-- 小屏幕表格纵向展示 -->
    <script src="./plugins/responsive-tables.js"></script>
    <!-- PDF/HTML 文件嵌入预览 -->
    <script src="./plugins/file-embed.js"></script>
    <!-- 音频/视频播放 -->
    <script src="./plugins/media-player.js"></script>
    <!-- 图片排列 -->
    <script src="./plugins/image-grid.js"></script>
    <!-- 图片等宽背景展示 -->
    <script src="./plugins/image-frame.js"></script>
    <!-- 术语表 -->
    <script src="./vendor/docsify-glossary/docsify-glossary.js"></script>
    <!-- 阅读进度条 -->
    <script src="./vendor/docsify-progress/progress.js"></script>
    <!-- 上一章/下一章 -->
    <script src="./vendor/docsify-pagination/docsify-pagination.min.js"></script>
    <!-- 主题切换 -->
    <script src="./plugins/theme-toggle.js"></script>
    <!-- 页面状态样式辅助 -->
    <script src="./plugins/page-state.js"></script>
    <!-- PWA 离线模式 -->
    <script src="./plugins/pwa-register.js?v=20260510-code-render"></script>
</body>

</html>
